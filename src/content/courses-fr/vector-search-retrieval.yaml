personalNote: |
  Ce cours est né d'un chantier bien réel. Je construis une base de données vectorielle souveraine, en Rust, dont le premier objectif est modeste : remplacer une brique existante dans mon intranet personnel. En la construisant, j'ai dû comprendre pour de vrai ce qui se cache derrière les mots à la mode : embedding, plus proche voisin, HNSW, recherche hybride, RAG. Pas la version marketing, la version qui compile.

  J'ai vite réalisé que ces concepts forment une chaîne d'une élégance rare. On part d'une idée presque philosophique, le sens comme une position dans l'espace, et on descend, marche après marche, jusqu'à des structures de données concrètes et des compromis d'ingénieur très palpables. Chaque chapitre répond à une limite laissée par le précédent.

  Je ne suis ni chercheur en recherche d'information ni spécialiste des bases de données de formation. J'écris ce cours comme je l'aurais voulu en démarrant mon propre moteur : rigoureux sur les définitions, honnête sur les compromis, et toujours accompagné de quelque chose à manipuler pour que l'intuition rentre. Le moteur que je construis sert de fil rouge, mais tout ce qu'on verra vaut pour n'importe quelle base vectorielle.
