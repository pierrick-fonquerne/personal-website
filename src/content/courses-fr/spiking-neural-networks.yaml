title: 'Réseaux de neurones impulsionnels : le neurone qui calcule dans le temps'
summary: Un cours universitaire accessible sur les réseaux de neurones impulsionnels (SNN). On part de la limite du neurone classique, qui ignore le temps, pour reconstruire un neurone à état qui intègre, fuit et décharge des impulsions. De la détection de coïncidence au gradient de substitution et au matériel neuromorphique.
