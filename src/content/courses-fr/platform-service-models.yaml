title: 'Architecturer une plateforme : monolithe intégré, services autonomes, fédération'
summary: "Quand plusieurs services d'une même plateforme manipulent les mêmes concepts (projet, environnement, organisation), qui en est propriétaire ? Trois modèles structurent toutes les réponses du marché : le monolithe intégré, les services autonomes et le modèle fédéré. Un cours d'architecture sur la topologie des plateformes, lu à travers les bounded contexts du Domain-Driven Design."
