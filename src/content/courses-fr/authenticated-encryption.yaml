slug: authenticated-encryption
title: 'Chiffrement authentifié : pourquoi chiffrer ne suffit jamais'
summary: "Chiffrer un message le rend illisible, pas inviolable. Ce cours de cryptographie appliquée construit l'intuition du chiffrement authentifié : confidentialité contre intégrité, l'AEAD et son tag, les pièges du nonce, les données associées et la séparation de domaines, les formats versionnés, et l'art de concevoir un échec qui ne fuit rien. Quatre chapitres, deux composants interactifs, des attaques réelles à chaque étape. Aucun langage de programmation requis."
