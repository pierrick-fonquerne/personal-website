fr:
  title: "Apprentissage local : apprendre sans gradient global"
  tagline: "Et si un réseau apprenait sans jamais propager d'erreur en arrière ? Trois familles de règles purement locales face à la rétropropagation."
  summary: "La rétropropagation domine l'IA, mais elle est globale : elle exige un balayage arrière qui réutilise tous les poids et verrouille les mises à jour. Le cerveau, lui, apprend localement. Ce dossier confronte la rétropropagation à trois alternatives locales (Forward-Forward, predictive coding, STDP) et explore ce que l'on gagne quand chaque synapse décide seule."
en:
  title: 'Local learning: learning without a global gradient'
  tagline: 'What if a network could learn without ever propagating an error backward? Three families of purely local rules against backpropagation.'
  summary: 'Backpropagation dominates AI, but it is global: it requires a backward sweep that reuses every weight and locks all updates. The brain, by contrast, learns locally. This piece pits backpropagation against three local alternatives (Forward-Forward, predictive coding, STDP) and explores what we gain when each synapse decides on its own.'
