fr:
  title: "SOAG : l'intelligence comme auto-organisation, pas comme optimisation"
  tagline: "Chercher le principe de portance de l'intelligence : des composants riches qui s'auto-organisent localement, plutôt que des composants pauvres optimisés globalement."
  summary: "SOAG est mon programme le plus spéculatif. Et si la voie royale du deep learning, empiler des couches de neurones pauvres, n'était que la réponse la plus facile de 1986 ? SOAG explore l'autre branche : enrichir le composant lui-même, le rendre temporel, plastique et local."
en:
  title: 'SOAG: intelligence as self-organization, not optimization'
  tagline: 'Searching for the lift principle of intelligence: rich components that self-organize locally, rather than poor components optimized globally.'
  summary: 'SOAG is my most speculative program. What if the royal road of deep learning, stacking layers of poor neurons, was merely the easiest answer available in 1986? SOAG explores the other branch: enriching the component itself, making it temporal, plastic and local.'
