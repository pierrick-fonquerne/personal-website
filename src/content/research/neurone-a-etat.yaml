fr:
  title: 'Le neurone à état'
  tagline: "Ce que l'état interne d'un neurone permet de calculer qu'un neurone sans mémoire ne peut pas."
  summary: "Synthèse et démonstration jouable : du neurone sans état de McCulloch-Pitts aux modèles à état interne (LIF, Hodgkin-Huxley, Izhikevich, AdEx), et ce que la mémoire interne débloque, jusqu'à l'équivalence d'un seul neurone avec un réseau profond."
en:
  title: 'The Stateful Neuron'
  tagline: "What a neuron's internal state lets it compute that a memoryless neuron cannot."
  summary: 'Synthesis and playable demonstration: from the stateless McCulloch-Pitts neuron to stateful models (LIF, Hodgkin-Huxley, Izhikevich, AdEx), and what internal memory unlocks, up to the equivalence of a single neuron with a deep network.'
