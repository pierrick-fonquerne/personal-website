fr:
  title: "AEIF : une intelligence qui naît de son vécu"
  tagline: "Construire un esprit par accumulation d'événements vécus, immuables et rejouables, au lieu de l'entraîner une fois pour toutes sur des corpus."
  summary: "AEIF est mon programme d'intelligence incarnée : pas de pré-entraînement figé, mais un agent qui apprend en vivant. Chaque expérience devient un événement horodaté qui nourrit sa mémoire, modifie son réseau et forge peu à peu une personnalité traçable."
en:
  title: 'AEIF: an intelligence born from its own experience'
  tagline: 'Building a mind by accumulating lived, immutable, replayable events, instead of training it once and for all on corpora.'
  summary: 'AEIF is my embodied-intelligence program: no frozen pre-training, but an agent that learns by living. Each experience becomes a timestamped event that feeds its memory, reshapes its network, and slowly forges a traceable personality.'
