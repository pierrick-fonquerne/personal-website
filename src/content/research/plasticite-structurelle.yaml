    note:
      fr: "À budget égal, les stratégies d'évolution oublient moins que le gradient. Elles se logent dans des zones larges qui recouvrent la tâche suivante."
      en: "At equal budget, evolution strategies forget less than gradient methods. They settle in wide regions that also cover the next task."
  - title: 'Continual Learning without Continual Training'
    authors: 'Narayanan et al. (2026)'
    href: 'https://arxiv.org/abs/2610.10379'
    note:
      fr: "Contrepoint : on évite l'oubli sans aucune plasticité, en gelant les poids et en adaptant seulement une mémoire d'exemples."
      en: "Counterpoint: forgetting is avoided with no plasticity at all, by freezing the weights and adapting only a memory of examples."
  - title: 'Stochastic Dynamics of Large-Scale Motif-Embedded Spiking Neuronal Networks'
    authors: 'Jagdev, Bertram & Yu (2026)'
    href: 'https://arxiv.org/abs/2610.00616'
    note:
      fr: "Contrepoint : une étude du câblage sans apprentissage. La forme globale du réseau (les hubs) compte plus que les motifs locaux."
      en: "Counterpoint: a study of wiring without learning. The global shape of the network (the hubs) matters more than local motifs."
published: true
fr:
  title: 'Plasticité structurelle : quand le réseau réécrit sa propre architecture'
  tagline: "Créer et supprimer neurones et connexions pendant le fonctionnement, au lieu de figer la topologie avant l'entraînement."
  summary: "La plupart des réseaux de neurones ont une forme fixée d'avance : seuls les poids changent. La plasticité structurelle inverse cette règle en faisant de la topologie une variable vivante. Un concept partagé entre les programmes SOAG et AEIF."
en:
  title: 'Structural plasticity: when the network rewrites its own architecture'
  tagline: 'Creating and removing neurons and connections at runtime, instead of freezing the topology before training.'
  summary: 'Most neural networks have a shape fixed in advance: only the weights change. Structural plasticity flips that rule by turning topology into a living variable. A concept shared between the SOAG and AEIF programs.'
