slug: e2e-encrypted-vault
title: 'Designing an end-to-end encrypted vault: from zero-knowledge to the storage format'
summary: 'How do you store files on a server without that server being able to read a single byte? This applied cryptography course walks through the complete design of a zero-knowledge file vault: an envelope-based key hierarchy, Argon2id derivation hardened against parameter-downgrade attacks, an authenticated blob format (AEAD, domain separation, header covered by the tag), content-defined chunking, content addressing and an encrypted Merkle tree. It ends with a threat-model exercise: we attack the system we just built and see what holds. No frameworks, only standard primitives and justified architecture decisions.'
