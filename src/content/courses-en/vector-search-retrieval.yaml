personalNote: |
  This course grew out of a very real build. I am writing a sovereign vector database, in Rust, whose first goal is modest: to replace an existing brick in my personal intranet. Building it forced me to truly understand what hides behind the buzzwords: embedding, nearest neighbor, HNSW, hybrid search, RAG. Not the marketing version, the version that compiles.

  I quickly realized that these concepts form a chain of rare elegance. You start from an almost philosophical idea, meaning as a position in space, and you descend, step after step, down to concrete data structures and very tangible engineering trade-offs. Each chapter answers a limit left open by the previous one.

  I am neither an information-retrieval researcher nor a formally trained database specialist. I write this course the way I would have wanted it when I started my own engine: rigorous about definitions, honest about trade-offs, and always paired with something to manipulate so the intuition sinks in. The engine I am building is the running thread, but everything we cover holds for any vector database.
