slug: vector-search-retrieval
title: 'Searching by meaning: vector databases and retrieval'
summary: "An accessible university-level course on semantic search. We start from the limit of keyword search, which ignores meaning, and rebuild search by meaning: represent a text as a vector, measure proximity, index millions of vectors without comparing them all, make the index durable, marry it with the lexical world, and finally feed a language model. From the geometry of embeddings to RAG."
