title: 'Spiking neural networks: the neuron that computes in time'
summary: An accessible university-level course on spiking neural networks (SNN). We start from the limit of the classical neuron, which ignores time, and rebuild a stateful neuron that integrates, leaks and fires spikes. From coincidence detection to the surrogate gradient and neuromorphic hardware.
