fr:
  title: Mathématiques de prépa (CPGE)
  tagline: Le programme dense des classes préparatoires scientifiques.
  summary: >-
    Le cœur des classes préparatoires : algèbre linéaire, arithmétique,
    polynômes, analyse réelle, équations différentielles et probabilités. Un
