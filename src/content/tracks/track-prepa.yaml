en:
  title: Preparatory Class Mathematics
  tagline: The dense curriculum of scientific preparatory classes.
  summary: >-
    The core of preparatory classes: linear algebra, arithmetic, polynomials,
    real analysis, differential equations and probability. A demanding stage
    that builds reasoning and rigor.
  audience: >-
    Students in scientific preparatory classes, or self-taught learners aiming
    for that level after consolidating high school.

