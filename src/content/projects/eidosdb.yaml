fr:
  title: EidosDB
  tagline: Index vectoriel en Rust pur pour la recherche ANN.
  summary: >-
    Bibliothèque Rust qui sert la recherche des plus proches voisins
    approximatifs (ANN) à partir d'embeddings pré-calculés, sans inférence
    embarquée ni JVM. Version pre-alpha : l'API reste de niveau bibliothèque,
    le serveur réseau et le binaire unique déployable en périphérie sont
    encore devant.
en:
  title: EidosDB
  tagline: A pure-Rust vector index for ANN search.
  summary: >-
    A Rust library serving approximate nearest neighbor search from
    precomputed embeddings, with no embedded inference and no JVM. Pre-alpha:
    the API is library-level only, the network server and the single
    edge-deployable binary are still ahead.
published: true
