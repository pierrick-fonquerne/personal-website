fr:
  title: Egide
  tagline: Gestionnaire de secrets auto-hébergé en Rust.
  summary: >-
    Coffre auto-hébergé pour vos secrets : stockage clé/valeur versionné et
    chiffré, chiffrement à la demande (Transit), descellement par partage de
    secret de Shamir, API REST et gRPC. Les clés ne quittent jamais votre
    infrastructure. Version alpha 0.1 : les moteurs KMS et PKI sont prévus,
    pas encore implémentés.
en:
  title: Egide
  tagline: A self-hosted secrets manager in Rust.
  summary: >-
    A self-hosted vault for your secrets: versioned encrypted key/value
    storage, encryption as a service (Transit), Shamir-based unsealing, REST
    and gRPC APIs. Your keys never leave your infrastructure. Alpha 0.1: the
    KMS and PKI engines are planned, not yet implemented.
published: true
