en:
  title: Isochron
  tagline: A pure-Rust cron occurrence engine.
  summary: >-
    Parses Vixie-standard cron expressions and computes next and previous
    occurrences in strict UTC. Pure, deterministic, with no async and no
    unsafe, designed as a dependable scheduling primitive.
