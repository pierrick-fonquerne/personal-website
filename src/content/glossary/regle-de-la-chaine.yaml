slug: regle-de-la-chaine
fr:
  term: Règle de la chaîne
  definition: Règle de calcul différentiel permettant de dériver une fonction composée. Si y = f(g(x)), alors dy/dx = f'(g(x)) · g'(x). C'est le pilier mathématique de la backpropagation, qui n'est qu'une application systématique de cette règle à travers un réseau.
en:
  term: Chain rule
  definition: A rule of differential calculus to differentiate a composite function. If y = f(g(x)), then dy/dx = f'(g(x)) · g'(x). It is the mathematical pillar of backpropagation, which is just a systematic application of this rule through a network.
seeAlso:
  - gradient
  - backpropagation
