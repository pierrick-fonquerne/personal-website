slug: regle-de-la-chaine
fr:
  term: "Règle de la chaîne"
  definition: "Règle de dérivation d'une composition de fonctions : la dérivée de f(g(x)) est f'(g(x)) multiplié par g'(x). On multiplie les dérivées locales le long du chemin. C'est le coeur mécanique de la rétropropagation."
en:
  term: Chain rule
  definition: "The rule for differentiating a composition of functions: the derivative of f(g(x)) is f'(g(x)) times g'(x). Local derivatives are multiplied along the path. It is the mechanical heart of backpropagation."
seeAlso:
  - derivee
  - composition-de-fonctions
  - backpropagation
