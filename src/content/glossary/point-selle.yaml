slug: point-selle
fr:
  term: Point selle
  definition: "Point où le gradient est nul mais qui n'est ni un minimum ni un maximum : la fonction y monte dans certaines directions et descend dans d'autres, comme un col de montagne. Exemple type : w₁² − w₂² à l'origine. En grande dimension, ils seraient bien plus fréquents que les minima locaux et ralentissent la descente de gradient."
  source: Dauphin et al., 2014
en:
  term: Saddle point
  definition: "A point where the gradient is zero but which is neither a minimum nor a maximum: the function rises in some directions and falls in others, like a mountain pass. Classic example: w₁² − w₂² at the origin. In high dimension they are argued to be far more common than local minima, and they slow gradient descent down."
  source: Dauphin et al., 2014
