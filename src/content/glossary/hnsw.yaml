slug: hnsw
fr:
  term: HNSW
  definition: "Hierarchical Navigable Small World : graphe hiérarchique navigable à petit monde. Index de recherche approchée qui empile des graphes de proximité en couches, rares et grossières en haut, denses et fines en bas. Une navigation gloutonne descend de couche en couche pour trouver les plus proches voisins en de l'ordre de log n sauts. Deux réglages : M (voisins par noeud, payé en mémoire) et ef (largeur de faisceau, payée en temps)."
en:
  term: HNSW
  definition: "Hierarchical Navigable Small World. An approximate search index that stacks proximity graphs in layers, sparse and coarse at the top, dense and fine at the bottom. A greedy walk descends layer by layer to find the nearest neighbors in about log n hops. Two knobs: M (neighbors per node, paid in memory) and ef (beam width, paid in time)."
source: Malkov & Yashunin, 2018
